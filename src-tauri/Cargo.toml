[package]
name = "chartagent-desktop"
version = "0.1.0"
description = "Figura desktop client"
authors = ["Figura"]
edition = "2021"

[lib]
name = "chartagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
