[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chartagent"
version = "0.1.0"
description = "Figura - agentic foundation for chart reading/generation"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.54.0,<3",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "pillow>=10",
    "rapidocr>=3.8",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chartagent = ["prompting/assets/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
